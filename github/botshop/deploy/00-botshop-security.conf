# Global hardening for the public reverse proxy.
# Loaded from nginx.conf's http context before virtual hosts.
server_tokens off;
server_name_in_redirect off;
port_in_redirect off;

client_max_body_size 2m;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 15s;
keepalive_timeout 30s;
keepalive_requests 200;
reset_timedout_connection on;
large_client_header_buffers 4 8k;

# Do not expose nginx/aiohttp/vendor banners or upstream technology headers.
more_clear_headers Server;
more_clear_headers X-Powered-By;
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: DENY";
more_set_headers "Referrer-Policy: no-referrer";
more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()";
more_set_headers "Cross-Origin-Opener-Policy: same-origin";
more_set_headers "Cross-Origin-Resource-Policy: same-origin";
more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";

proxy_hide_header Server;
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 60s;
proxy_buffering on;

# Never put query strings (which may contain accidental credentials) in logs.
log_format botshop_secure '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log botshop_secure;

# TLS session hardening; certificates and protocol selection stay in Certbot's
# managed virtual-host blocks.
ssl_session_cache shared:SSL:20m;
ssl_session_timeout 10m;
