[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/xray-config",
    "crates/subscription",
    "crates/api",
    "crates/orchestrator",
    "crates/node-agent",
    "crates/probe",
    "crates/billing-bot",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "macros", "rust_decimal"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
rust_decimal = { version = "1", features = ["serde"] }

# local crates
vpn-core = { path = "crates/core" }
vpn-xray-config = { path = "crates/xray-config" }
vpn-subscription = { path = "crates/subscription" }

[profile.release]
lto = "thin"
strip = true
