<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SOUS MARKET — цифровые товары и сервисы в Telegram с быстрым оформлением и автоматической выдачей.">
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
    <link rel="canonical" href="https://sousmarketfranchize.shop/miniapp/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SOUS MARKET">
    <meta property="og:title" content="SOUS MARKET — цифровые товары и сервисы">
    <meta property="og:description" content="Цифровые сервисы с автоматической выдачей в Telegram.">
    <meta property="og:url" content="https://sousmarketfranchize.shop/miniapp/">
    <meta name="twitter:card" content="summary">
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"SOUS MARKET","url":"https://sousmarketfranchize.shop/miniapp/","description":"Цифровые товары и сервисы с автоматической выдачей."}</script>
    <title>SOUS MARKET — цифровые товары и сервисы</title>
    <style>
      /* critical: kill first-paint flash before styles.css loads */
      html, body { margin: 0; }
      body { background: var(--tg-theme-secondary-bg-color, #17212b); }
      .app-shell { width: 100%; max-width: 560px; margin: 0 auto; }
      .screen { display: none; }
      .screen.screen-active { display: block; }
      .overlay.hidden { display: none; }
      .hidden { display: none !important; }
      .glow, .glow-left, .glow-right, .dust { display: none; }
    </style>
    <link rel="stylesheet" href="./styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <noscript><main><h1>SOUS MARKET — цифровые товары и сервисы</h1><p>Откройте каталог цифровых сервисов, аккаунтов и автоматической выдачи.</p></main></noscript>
    <main class="app-shell">
      <div class="glow glow-left"></div>
      <div class="glow glow-right"></div>
      <div class="dust"></div>

      <header class="topbar">
        <div class="brand">
          <div id="brand-badge" class="brand-badge"></div>
          <div class="brand-copy">
            <h1 id="brand-name"></h1>
            <p id="brand-subtitle"></p>
          </div>
        </div>
        <button id="topup-trigger" class="balance-pill" type="button">
          <span class="balance-label">Баланс</span>
          <strong id="balance-value">0 $</strong>
          <span class="balance-plus">+</span>
        </button>
      </header>

      <section class="commerce-proof" aria-label="Преимущества магазина">
        <span><b>✓</b><span id="proof-delivery">Выдача после оплаты</span></span>
        <span><b>✓</b><span id="proof-balance">Оплата с баланса</span></span>
        <span><b>✓</b><span id="proof-support">Поддержка</span></span>
      </section>

      <section id="screen-catalog" class="screen screen-active">
        <button id="catalog-top-favorites" class="catalog-top-favorites" type="button">♥ Избранное</button>
        <div class="section-head">
          <span class="section-kicker">Каталог</span>
          <h2>Каталог</h2>
          <p id="catalog-intro">Цена и остаток видны до покупки.</p>
        </div>

        <div class="catalog-shell">
          <div id="catalog-categories" class="directory-grid"></div>
          <aside class="selection-panel">
            <h3 id="catalog-selection-title">Категория</h3>
            <p id="catalog-selection-subtitle"></p>
            <div id="catalog-filter-panel" class="catalog-filter-panel catalog-filter-panel-collapsed">
              <div class="catalog-filter-grid">
                <label class="filter-field">
                  <span>Категория</span>
                  <select id="catalog-category-filter">
                    <option value="">Выберите категорию</option>
                  </select>
                </label>
                <div class="filter-row">
                  <label class="filter-field">
                    <span>Цена от</span>
                    <input id="catalog-price-min" type="number" min="0" step="0.01" placeholder="0.1" />
                  </label>
                  <label class="filter-field">
                    <span>Цена до</span>
                    <input id="catalog-price-max" type="number" min="0" step="0.01" placeholder="100000" />
                  </label>
                </div>
                <div class="filter-field">
                  <span>Теги</span>
                  <div id="catalog-attribute-filters" class="filter-chip-grid"></div>
                </div>
                <div class="filter-actions">
                  <button id="catalog-apply-filters" class="filter-button filter-button-primary" type="button">Применить</button>
                  <button id="catalog-reset-filters" class="filter-button filter-button-secondary" type="button">Сбросить</button>
                </div>
              </div>
            </div>
            <div id="catalog-results-meta" class="results-bar">Выберите категорию, чтобы увидеть товары.</div>
            <div id="catalog-status" class="helper-text">Загрузка каталога…</div>
          </aside>
        </div>

        <div class="catalog-products-head catalog-products-toolbar">
          <div class="catalog-products-controls">
            <label class="catalog-search-field">
              <span aria-hidden="true">⌕</span>
              <input id="catalog-search" type="search" autocomplete="off" placeholder="Поиск товаров" />
            </label>
            <button
              id="catalog-filter-toggle"
              class="catalog-filter-sticker"
              type="button"
              aria-expanded="false"
              aria-label="Открыть фильтр"
              title="Фильтр"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6h16l-6.2 7.1v4.4l-3.6 2.2v-6.6L4 6Z" fill="currentColor"/>
              </svg>
            </button>
            <label class="toolbar-select">
              <select id="catalog-sort-filter">
                <option value="popular">Сначала популярные</option>
                <option value="cheap">Сначала дешёвые</option>
                <option value="expensive">Сначала дорогие</option>
                <option value="stock">По остатку</option>
              </select>
            </label>
          </div>
        </div>
        <div id="catalog-products" class="card-list catalog-products-list"></div>
        <div id="catalog-pagination" class="catalog-pagination hidden"></div>
      </section>

      <section id="screen-orders" class="screen">
        <div class="section-head">
          <span class="section-kicker">Заказы</span>
          <h2>Заказы</h2>
          <p></p>
        </div>

        <div id="orders-status" class="helper-text">Загрузка заказов…</div>
        <div id="orders-list" class="card-list"></div>
        <div id="orders-empty" class="empty-state hidden">
          <div class="empty-orb"></div>
          <h3>Пусто</h3>
          <p>Пока нет покупок</p>
        </div>
      </section>

      <section id="screen-profile" class="screen">
        <div class="section-head">
          <span class="section-kicker">Профиль</span>
          <h2>Профиль</h2>
          <p></p>
        </div>

        <div class="profile-panel">
          <button id="profile-topup" class="primary-button" type="button">Пополнить</button>
          <div class="stat-block">
            <strong id="profile-orders-count">0</strong>
            <span>покупок</span>
          </div>
        </div>

        <div class="menu-list">
          <button class="menu-row" type="button" data-action="referral">
            <span class="menu-icon">%</span>
            <span class="menu-text">Реферальная программа</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row" type="button" data-action="transactions">
            <span class="menu-icon">⏺</span>
            <span class="menu-text">История операций</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row" type="button" data-action="promocode">
            <span class="menu-icon">🎟</span>
            <span class="menu-text">Активировать промокод</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row" type="button" data-action="support">
            <span class="menu-icon">?</span>
            <span class="menu-text">Поддержка</span>
            <span class="menu-arrow">›</span>
          </button>
          <button class="menu-row" type="button" data-action="rules">
            <span class="menu-icon">≡</span>
            <span class="menu-text">Правила</span>
            <span class="menu-arrow">›</span>
          </button>
        </div>
      </section>

      <nav class="bottom-nav">
        <button class="nav-button" type="button" data-screen="orders">
          <span class="nav-button-shell">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.5 4.75h11A2.75 2.75 0 0 1 20.25 7.5v9A2.75 2.75 0 0 1 17.5 19.25h-11A2.75 2.75 0 0 1 3.75 16.5v-9A2.75 2.75 0 0 1 6.5 4.75Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <path d="M7.5 8.5h9M7.5 12h9M7.5 15.5h5.5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/>
              </svg>
            </span>
            <span class="nav-label">Заказы</span>
          </span>
        </button>
        <button class="nav-button nav-button-active" type="button" data-screen="catalog">
          <span class="nav-button-shell">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect x="4.25" y="4.25" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="13.25" y="4.25" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="4.25" y="13.25" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="13.25" y="13.25" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <span class="nav-label">Каталог</span>
          </span>
        </button>
        <button class="nav-button" type="button" data-screen="profile">
          <span class="nav-button-shell">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12.1a3.85 3.85 0 1 0 0-7.7 3.85 3.85 0 0 0 0 7.7Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <path d="M5.25 18.4c1.55-2.65 4-3.98 6.75-3.98s5.2 1.33 6.75 3.98" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"/>
                <path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <span class="nav-label">Профиль</span>
          </span>
        </button>
      </nav>

      <footer id="bot-footer" class="bot-footer"></footer>
      <button id="catalog-cart-button" class="catalog-cart-button catalog-cart-button-floating" type="button" aria-label="Открыть корзину" title="Корзина">
        <span class="catalog-cart-icon">🛒</span>
        <span id="catalog-cart-count" class="catalog-cart-count hidden">0</span>
      </button>
    </main>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-backdrop"></div>
      <section class="overlay-sheet">
        <button id="overlay-close" class="overlay-close" type="button">×</button>
        <div id="overlay-content"></div>
      </section>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
